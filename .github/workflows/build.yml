name: Vädret Android App

on:
  pull_request:
    push:
      branches:
        - dev
        - master

permissions:
  contents: read
  packages: read

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Run ktlint
        run: ./gradlew ktlint
  tests:
    name: unittests
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
      - name: Tests
        run: ./gradlew test