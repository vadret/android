plugins {
    id 'vadret.android.library'
    id 'vadret.android.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'fi.kroon.vadret.core'
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':data:aggregatedfeed')
    implementation project(':data:autocomplete')
    implementation project(':data:common')
    implementation project(':data:library')
    implementation project(':data:location')
    implementation project(':data:nominatim')
    implementation project(':data:radar')
    implementation project(':data:theme')
    implementation project(':data:warningfilter')
    implementation project(':data:weatherforecast')

    implementation libs.androidx.annotation
    implementation libs.coroutines.core
    implementation libs.dagger.runtime
    implementation libs.ktor.client.content.negotiation
    implementation libs.ktor.client.core
    implementation libs.ktor.client.okhttp
    implementation libs.ktor.serialization.kotlinx.json
    implementation libs.okhttp.core
    implementation libs.okhttp.logging

    ksp libs.dagger.compiler
}
