[versions]
agp = "9.1.1"
kotlin = "2.4.21"
ksp = "2.3.12"

android-compileSdk = "37"
android-minSdk = "23"
android-targetSdk = "37"

androidxAnnotation = "1.9.1"
androidxCardview = "1.0.0"
androidxCollection = "1.4.2"
androidxRecyclerview = "1.1.0"
androidxSwiperefreshlayout = "1.1.0"
androidxViewpager = "1.0.0"
appcompat = "1.2.0"
assertj = "3.14.0"
coil = "1.1.1"
commonsCsv = "1.7"
constraintlayout = "2.0.4"
corbind = "1.5.0"
coreKtx = "1.3.2"
coroutines = "1.11.0"
dagger = "2.60.1"
either = "2.4.3"
fragment = "1.3.2"
junit = "4.13"
kotlinxSerialization = "1.12.0"
ktor = "3.6.0"
ktlint = "0.41.0"
leakcanary = "2.6"
lifecycle = "2.3.0"
material = "1.3.0"
mockito = "5.24.0"
navigation = "2.3.4"
okhttp = "5.5.1"
okio = "3.18.2"
osmdroid = "6.1.20"
permissionsDispatcher = "4.8.0"
preference = "1.1.1"
room = "2.8.5"
threetenabp = "1.2.1"
threetenbp = "1.5.0"
timber = "4.7.1"

[libraries]
# Gradle plugins
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-gradleKotlinPlugin = { module = "com.android.tools.build:gradle-kotlin", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serializationPlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

# Android
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidxCardview" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidxCollection" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidxSwiperefreshlayout" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "androidxViewpager" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Lifecycle
lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Coroutines
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Reactive
corbind-appcompat = { module = "ru.ldralighieri.corbind:corbind-appcompat", version.ref = "corbind" }
corbind-core = { module = "ru.ldralighieri.corbind:corbind-core", version.ref = "corbind" }
corbind-swiperefreshlayout = { module = "ru.ldralighieri.corbind:corbind-swiperefreshlayout", version.ref = "corbind" }

# Network
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# Database
room-common = { module = "androidx.room:room-common", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Dependency Injection
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
dagger-runtime = { module = "com.google.dagger:dagger", version.ref = "dagger" }

# Miscellaneous
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
either = { module = "io.github.sphrak:either", version.ref = "either" }
osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
permissionsdispatcher-processor = { module = "com.github.permissions-dispatcher:permissionsdispatcher-processor", version.ref = "permissionsDispatcher" }
permissionsdispatcher-runtime = { module = "com.github.permissions-dispatcher:permissionsdispatcher", version.ref = "permissionsDispatcher" }

# Datetime
threetenabp = { module = "com.jakewharton.threetenabp:threetenabp", version.ref = "threetenabp" }
threetenbp = { module = "org.threeten:threetenbp", version.ref = "threetenbp" }

# Debugging, Testing, Linting
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit = { module = "junit:junit", version.ref = "junit" }
ktlint = { module = "com.pinterest:ktlint", version.ref = "ktlint" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
