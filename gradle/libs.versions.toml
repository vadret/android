[versions]
agp = "9.1.1"
kotlin = "2.4.21"
ksp = "2.3.12"

android-compileSdk = "36"
android-minSdk = "21"
android-targetSdk = "30"

androidxAnnotation = "1.9.1"
androidxCardview = "1.0.0"
androidxCollection = "1.4.2"
androidxRecyclerview = "1.1.0"
androidxSwiperefreshlayout = "1.1.0"
androidxViewpager = "1.0.0"
appcompat = "1.2.0"
assertj = "3.14.0"
coil = "1.1.1"
commonsCsv = "1.7"
constraintlayout = "2.0.4"
corbind = "1.5.0"
coreKtx = "1.3.2"
coroutines = "1.11.0"
dagger = "2.60.1"
either = "1.9.0"
fragment = "1.3.2"
junit = "4.13"
kotlinxSerialization = "1.11.0"
ktlint = "0.41.0"
leakcanary = "2.6"
lifecycle = "2.3.0"
material = "1.3.0"
mockito = "5.24.0"
moshi = "1.15.2"
navigation = "2.3.4"
okhttp = "4.2.2"
okio = "2.6.0"
osmdroid = "6.1.10"
permissionsDispatcher = "4.8.0"
preference = "1.1.1"
retrofit = "2.9.0"
retrofitKotlinxSerializationConverter = "0.8.0"
room = "2.7.2"
rxandroid = "2.1.1"
rxbinding = "3.1.0"
rxjava = "2.2.19"
rxkotlin = "2.4.0"
rxkprefs = "1.2.5"
threetenabp = "1.2.1"
threetenbp = "1.5.0"
timber = "4.7.1"

[libraries]
# Gradle plugins
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
android-gradleKotlinPlugin = { module = "com.android.tools.build:gradle-kotlin", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serializationPlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }

# Android
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "androidxCardview" }
androidx-collection = { module = "androidx.collection:collection", version.ref = "androidxCollection" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidxRecyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "androidxSwiperefreshlayout" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "androidxViewpager" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# Lifecycle
lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Coroutines
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-rx2 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-rx2", version.ref = "coroutines" }

# Reactive
corbind-appcompat = { module = "ru.ldralighieri.corbind:corbind-appcompat", version.ref = "corbind" }
corbind-core = { module = "ru.ldralighieri.corbind:corbind-core", version.ref = "corbind" }
corbind-swiperefreshlayout = { module = "ru.ldralighieri.corbind:corbind-swiperefreshlayout", version.ref = "corbind" }
rxandroid = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rxandroid" }
rxbinding-core = { module = "com.jakewharton.rxbinding3:rxbinding", version.ref = "rxbinding" }
rxbinding-appcompat = { module = "com.jakewharton.rxbinding3:rxbinding-appcompat", version.ref = "rxbinding" }
rxbinding-material = { module = "com.jakewharton.rxbinding3:rxbinding-material", version.ref = "rxbinding" }
rxbinding-recyclerview = { module = "com.jakewharton.rxbinding3:rxbinding-recyclerview", version.ref = "rxbinding" }
rxbinding-swiperefreshlayout = { module = "com.jakewharton.rxbinding3:rxbinding-swiperefreshlayout", version.ref = "rxbinding" }
rxbinding-viewpager = { module = "com.jakewharton.rxbinding3:rxbinding-viewpager", version.ref = "rxbinding" }
rxjava = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava" }
rxkotlin = { module = "io.reactivex.rxjava2:rxkotlin", version.ref = "rxkotlin" }

# Network
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
retrofit-adapter-rxjava2 = { module = "com.squareup.retrofit2:adapter-rxjava2", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerializationConverter" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

# Database
room-common = { module = "androidx.room:room-common", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-rxjava2 = { module = "androidx.room:room-rxjava2", version.ref = "room" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
moshi-adapters = { module = "com.squareup.moshi:moshi-adapters", version.ref = "moshi" }
moshi-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
moshi-core = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }

# Dependency Injection
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
dagger-runtime = { module = "com.google.dagger:dagger", version.ref = "dagger" }

# Miscellaneous
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
commons-csv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
either = { module = "se.fimbla:either", version.ref = "either" }
osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
permissionsdispatcher-processor = { module = "com.github.permissions-dispatcher:permissionsdispatcher-processor", version.ref = "permissionsDispatcher" }
permissionsdispatcher-runtime = { module = "com.github.permissions-dispatcher:permissionsdispatcher", version.ref = "permissionsDispatcher" }
rxkprefs = { module = "com.afollestad:rxkprefs", version.ref = "rxkprefs" }

# Datetime
threetenabp = { module = "com.jakewharton.threetenabp:threetenabp", version.ref = "threetenabp" }
threetenbp = { module = "org.threeten:threetenbp", version.ref = "threetenbp" }

# Debugging, Testing, Linting
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit = { module = "junit:junit", version.ref = "junit" }
ktlint = { module = "com.pinterest:ktlint", version.ref = "ktlint" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
