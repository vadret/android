buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.android.gradlePlugin
        classpath libs.android.gradleKotlinPlugin
        classpath libs.kotlin.gradlePlugin
        classpath libs.kotlin.composeCompilerPlugin
        classpath libs.kotlin.serializationPlugin
        classpath libs.ksp.gradlePlugin
    }

}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/sphrak/Either"
            credentials(PasswordCredentials)
            content {
                includeGroup "io.github.sphrak"
            }
        }
        mavenLocal {
            content {
                includeGroup "io.github.sphrak"
            }
        }
    }
}

apply plugin: 'jvm-toolchains'

configurations {
    ktlint {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
    }
}

dependencies {
    ktlint libs.ktlint
}

def ktlintLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(11)
}

tasks.register("ktlint", JavaExec) {
    description = "Check Kotlin code style."
    classpath = configurations.ktlint
    mainClass = "com.pinterest.ktlint.Main"
    javaLauncher = ktlintLauncher
    args "**/src/**/*.kt", "!**/build/**"
    // to generate report in checkstyle format prepend following args:
    // "--reporter=plain", "--reporter=checkstyle,output=${buildDir}/ktlint.xml"
    // see https://github.com/shyiko/ktlint#usage for more
}

tasks.register("ktlintFormat", JavaExec) {
    description = "Fix Kotlin code style deviations."
    classpath = configurations.ktlint
    mainClass = "com.pinterest.ktlint.Main"
    javaLauncher = ktlintLauncher
    args "-F", "**/src/**/*.kt", "!**/build/**"
}
