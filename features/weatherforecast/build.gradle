plugins {
    id 'vadret.android.feature'
    id 'com.google.devtools.ksp'
    id 'com.android.legacy-kapt'
}

android {
    namespace 'fi.kroon.vadret.weatherforecast'
}

dependencies {
    implementation project(':data:autocomplete')
    implementation project(':data:common')
    implementation project(':data:location')
    implementation project(':data:nominatim')
    implementation project(':data:weatherforecast')

    implementation libs.androidx.annotation
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.corbind.appcompat
    implementation libs.corbind.core
    implementation libs.corbind.swiperefreshlayout
    implementation libs.dagger.runtime
    implementation libs.kotlinx.serialization.json
    implementation libs.moshi.core
    implementation libs.okhttp.core
    implementation libs.permissionsdispatcher.runtime
    implementation libs.retrofit.converter.kotlinx.serialization
    implementation libs.retrofit.converter.moshi
    implementation libs.retrofit.core
    implementation libs.timber

    ksp libs.dagger.compiler
    kapt libs.permissionsdispatcher.processor
}
